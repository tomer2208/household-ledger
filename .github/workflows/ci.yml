# Checks every push and pull request before Vercel ships main (T1, docs/PRODUCT_ROADMAP.md).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (types, lint, unit tests, web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # The build only needs these to exist; the real values live in Vercel.
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo lint
      - run: npm test
      - name: Server amount parser and push copy
        run: node --test ../../supabase/functions/capture/amount.test.ts ../../supabase/functions/push-dispatch/compose.test.ts
      - run: npm run build:web

  db:
    name: Database (all migrations from scratch, SQL tests, schema types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Postgres and apply every migration
        run: supabase db start
      - name: SQL tests
        run: supabase/tests/run.sh
      - name: Schema types match the migrations
        run: supabase/scripts/check-types.sh
      - name: Upload the regenerated schema types
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database.types
          path: .schema-types/database.types.ts
          if-no-files-found: ignore

  e2e:
    name: E2E (five main flows, English and Hebrew)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Start a local Supabase (database, auth, API) with every migration
        run: supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: npm ci
        working-directory: apps/mobile
      - run: npx playwright install --with-deps chromium
        working-directory: apps/mobile
      - name: Build the web app against it and run the flows
        run: npm run e2e
        working-directory: apps/mobile
      - name: Upload screenshots and traces of failed flows
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
          if-no-files-found: ignore
