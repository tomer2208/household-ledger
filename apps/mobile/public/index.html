    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #f2f5f4;
        /* No grey flash on tap, no callout on long-press: feels like an app, not a page. */
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0a1113;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* P1-6: react-native-web gives every text dir="auto", so an English merchant name in the
         Hebrew UI would align left. Text without an explicit alignment starts at the right like
         the page (match-parent would say it, but not every browser has it); its own direction
         (word order) still comes from its content. */
      :where(html[dir="rtl"]) [dir="auto"]:not([class*="r-textAlign"]) {
        text-align: right;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="/register-sw.js"></script>
  </body>
