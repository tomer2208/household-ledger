<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app draw under the notch and home bar; safe-area insets pad the content. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Installable web app (Add to Home Screen). -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FinPace" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F5F4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A1113" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #f2f5f4;
        /* No grey flash on tap, no callout on long-press: feels like an app, not a page. */
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0a1113;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* P1-6: react-native-web gives every text dir="auto", so an English merchant name in the
         Hebrew UI would align left. Text without an explicit alignment starts at the right like
         the page (match-parent would say it, but not every browser has it); its own direction
         (word order) still comes from its content. */
      :where(html[dir="rtl"]) [dir="auto"]:not([class*="r-textAlign"]) {
        text-align: right;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="/register-sw.js"></script>
  </body>
</html>
